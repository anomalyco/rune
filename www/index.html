      @font-face { font-family: "Geist Mono"; src: url("/fonts/geist-mono.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
      :root {
        --rune-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

      }
      html { background: #000; color: #ededed; font: 400 16px/24px var(--rune-sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-size-adjust: 100%; }
      body { margin: 0; }
      :focus-visible { outline: 2px solid oklch(0.74 0.14 245); outline-offset: 2px; border-radius: 4px; }
