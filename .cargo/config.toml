# Use rustc's bundled rust-lld on Windows MSVC instead of link.exe (zero extra installs).
# On Rust 1.90+, x86_64-unknown-linux-gnu already defaults to rust-lld; `-C linker-features=+lld`
# remains unstable on Rust 1.99.1, so Linux and macOS use their toolchain defaults.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.aarch64-pc-windows-msvc]
linker = "rust-lld"

# Opt-in local developer shortcuts (default-members fast paths and wasm/webgl checks).
[alias]
lint = "clippy --lib --bins --tests"
lint-all = "clippy --workspace --all-targets"
check-wasm = "check -p rune --no-default-features --target wasm32-unknown-unknown"
check-webgl = "check -p rune --no-default-features --features webgl --target wasm32-unknown-unknown"
test-fast = "test -p rune -p rune-mermaid -p rune-kit --features rune-kit/markdown,rune-kit/mermaid"
