[package]
name = "rune-notify"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "System notifications for Rune apps: UNUserNotificationCenter on macOS, toast notifications on Windows."

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
block2 = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.6"

[lints]
workspace = true
