[package]
name = "rune-motion"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rune's animation runtime: analytic springs, retargetable tracks, presence, layout and matched-geometry animation, driven by a render thread."
publish = false
autotests = false

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, features = ["derive"], optional = true }

[[test]]
name = "integration"

[[test]]
name = "alloc"

[lints]
workspace = true
