[package]
name = "rune-kit"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Generic, themable components for Rune. Components read only semantic tokens (`Kit`); a theme crate supplies them."

[dependencies]
rune = { workspace = true }
# The built-in syntax highlighter: Desktop's own lexers (syntax).
rune-highlights = { workspace = true, optional = true }
rune-mermaid = { workspace = true, optional = true }
rune-motion = { workspace = true }
# Search's accent folding (`search`): NFD, the data Parley already links.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
unicode-segmentation = { workspace = true }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }

[features]
default = ["syntax"]
# Built-in syntax highlighting via `rune-highlights` (80 languages). Disable with
# `default-features = false` to drop the lexers when an app provides its own highlighter or
# draws no code.
syntax = ["dep:rune-highlights"]
# `Markdown` and `MarkdownStyle`.
markdown = ["syntax", "dep:pulldown-cmark"]
# Native ```mermaid diagrams in `Markdown` (flowcharts, sequence and state diagrams), and `mermaid`.
mermaid = ["markdown", "dep:rune-mermaid"]
# Phase timings for the headless benches (`markdown_resize`).
frame-profile = ["rune/frame-profile"]

[[example]]
name = "scroll_x"
required-features = ["markdown"]

[[example]]
name = "markdown_resize"
required-features = ["markdown", "frame-profile"]

[[example]]
name = "scroll_bench"
required-features = ["markdown", "frame-profile"]

[[example]]
name = "layout_text_cost"
required-features = ["markdown", "frame-profile"]

[dev-dependencies]
rune = { workspace = true, default-features = true }
procwatch = { workspace = true }
# The accessibility tree tests read and write `Runtime::accessibility_json` (tests/a11y).
serde_json = { workspace = true }
# Reference rasteriser for the built-in glyphs (tests/integration/glyphs.rs).
resvg = { workspace = true }
# The fixture goldens render with the OpenCode theme's tokens and fonts (tests/mermaid/markdown_fixture.rs).
rune-theme-opencode = { workspace = true }

[[test]]
name = "markdown"
required-features = ["markdown"]

[[test]]
name = "mermaid"
required-features = ["markdown", "mermaid"]

[lints]
workspace = true
