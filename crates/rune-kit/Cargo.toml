[package]
name = "rune-kit"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Generic, themable components for Rune. Components read only semantic tokens (`Kit`); a theme crate supplies them."

[dependencies]
rune = { path = "../rune", default-features = false }
# The built-in syntax highlighter: Desktop's own lexers (syntax).
rune-highlights = { path = "../rune-highlights" }
rune-mermaid = { path = "../rune-mermaid", optional = true }
rune-motion = { path = "../rune-motion" }
# Search's accent folding (`search`): NFD, the data Parley already links.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
unicode-segmentation = "1.13"
pulldown-cmark = { version = "0.13", default-features = false, optional = true }

[features]
# `Markdown` and `MarkdownStyle`.
markdown = ["dep:pulldown-cmark"]
# Native ```mermaid diagrams in `Markdown` (flowcharts, sequence and state diagrams), and `mermaid`.
mermaid = ["markdown", "dep:rune-mermaid"]
# Phase timings for the headless benches (`markdown_resize`).
frame-profile = ["rune/frame-profile"]

[[example]]
name = "scroll_x"
required-features = ["markdown"]

[[example]]
name = "markdown_resize"
required-features = ["markdown", "frame-profile"]

[[example]]
name = "scroll_bench"
required-features = ["markdown", "frame-profile"]

[[example]]
name = "layout_text_cost"
required-features = ["markdown", "frame-profile"]

[dev-dependencies]
# The examples' headless runs (`--snap`, `--trace`, ...) in release builds.
rune = { path = "../rune", default-features = false, features = ["keys-overlay"] }
procwatch = { path = "../procwatch" }
# The accessibility tree tests read and write `Runtime::accessibility_json` (tests/a11y).
serde_json = "1"
# Reference rasteriser for the built-in glyphs (tests/glyphs.rs).
resvg = { version = "0.45", default-features = false }
# The scroll bar's fade test rasterises its frame with the reference renderer (tests/scroll_bar_fade.rs).
rune-ref = { path = "../rune-ref", features = ["gpu"] }
# The fixture goldens render with the OpenCode theme's tokens and fonts (tests/markdown_fixture.rs).
rune-theme-opencode = { path = "../../themes/opencode" }

[[test]]
name = "markdown_fixture"
required-features = ["markdown", "mermaid"]

[[test]]
name = "markdown_diagram_stream"
required-features = ["markdown", "mermaid"]

[[test]]
name = "markdown_diagram_frame"
required-features = ["markdown", "mermaid"]

[lints]
workspace = true
