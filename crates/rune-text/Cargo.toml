[package]
name = "rune-text"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "GPU-free text shaping, layout, font discovery, glyph rasterization, outline filling, and icon rendering for Rune."

[features]
default = ["embedded-fonts", "svg", "rune-image/default"]
# Bundle Inter (Regular, Medium, SemiBold; on web also IBM Plex Mono) as the fonts text falls back
# to when the app registers none. Disable when AppSpec::fonts supplies the app's own fonts to omit
# the bytes (about 1.25 MB native).
embedded-fonts = []
# Windows: link ICU4X's word dictionaries (Chinese and Japanese words above all: 1,939,456 B of a
# minimal release exe) instead of asking Windows' own ICU (`icu.dll`, Windows 10 1903 and later) for
# the words a double-click and word movement take. For an app that runs where `icu.dll` isn't
# (Server Core). Line breaks never need it: Thai, Lao, Khmer and Burmese keep their baked line
# dictionaries either way. Other native platforms always link the word dictionaries.
segmenter-dictionaries = ["parley/complex-scripts"]
# Colour SVG icons rasterized through rune-image/resvg. Off, every icon draws monochrome.
svg = ["rune-image/svg"]

[dependencies]
bytemuck = { workspace = true }
# Bidi classes for `Direction::Auto` (Parley already builds it, with its data).
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
# Words for a double-click and pretty line breaks, natively with the dictionaries Parley's `complex-scripts` links.
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }
# Natively with `complex-scripts` (below): ICU4X's word and line dictionaries, as a browser's ICU
# has them.
parley = { workspace = true, features = ["std"] }
rune-core = { workspace = true }
rune-image = { workspace = true }
rune-motion = { workspace = true }
rustc-hash = { workspace = true }
skrifa = "0.44"
swash = { workspace = true }
# Skia's paths and stroker, for icons covered as Chromium covers them (icon/area.rs): tiny-skia-path
# as published plus `vendor/tiny-skia-path.patch` (Skia's conic splitting and stroker steps), re-made
# by `scripts/vendor-tiny-skia-path.sh <version>`. Renamed to `rune-tiny-skia-path` as a path
# dependency, not a patch, so resvg keeps crates.io's `tiny-skia-path` without colliding.
tiny-skia-path = { package = "rune-tiny-skia-path", path = "../../vendor/tiny-skia-path" }
unicode-segmentation = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
# `complex-scripts`: Chinese and Japanese words (2.0 MB) and Thai, Lao, Khmer and Burmese words and
# line breaks (1.8 MB); without them a Thai phrase never wraps and every CJK line logs a missing
# segmentation model. A browser has its own (`Intl.Segmenter`), which the page gives Parley
# (`segmenter/web.rs`), and Windows has its own (`icu.dll`, `segmenter/win32.rs`); neither links them.
parley = { workspace = true, features = ["std", "complex-scripts"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Installed fonts by family name (`fonts::system_fonts::installed_family_files`): fontique's
# DirectWrite, CoreText and fontconfig backends, in a collection apart from the app's, which
# keeps system fonts off. Fontconfig opens at run time, so a build needs no headers for it.
fontique = { version = "0.12", default-features = false, features = ["std", "system", "fontconfig-dlopen"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `dictionary::set_dictionary_segmenter` (vendor/parley_engine), for `Intl.Segmenter`'s words,
# and `platform::set_platform_face` for browser-drawn fallback runs.
parley_engine = { workspace = true }
wasm-bindgen = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["std", "CFArray", "CFDictionary", "CFLocale", "CFNumber", "CFPreferences", "CFString", "CFURL"] }
# CoreText's font fallback and family lookups (`fonts/system_fonts/core_text.rs`); fontique already builds it.
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont", "CTFontDescriptor", "CTFontManager"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# `dictionary::set_dictionary_segmenter` (vendor/parley_engine), for `icu.dll`'s words, and
# `line-dictionaries`: Thai, Lao, Khmer and Burmese line breaks from ICU4X's baked line dictionaries,
# so no line ever waits for `icu.dll`.
parley_engine = { workspace = true, features = ["line-dictionaries"] }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_DirectWrite"] }
windows-core = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_LibraryLoader"] }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
