[package]
name = "rune-fx"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Rune's special-effects layers: glow, pulses, electricity, fire, motion blur, distortion."
autotests = false

[dependencies]
rune-motion = { workspace = true }
rune-staging = { workspace = true }
wgpu = { workspace = true, features = ["std", "parking_lot", "wgsl"] }
bytemuck = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { workspace = true, features = ["metal", "custom"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }

[target.'cfg(all(not(target_vendor = "apple"), not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu"] }

[dev-dependencies]
rune = { workspace = true, default-features = true }
ab_glyph = "0.2.32"
png = { workspace = true }

[[test]]
name = "integration"

[lints]
workspace = true
