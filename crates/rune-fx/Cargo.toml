[package]
name = "rune-fx"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Rune's special-effects layers: glow, pulses, electricity, fire, motion blur, distortion."

[dependencies]
rune-motion = { path = "../rune-motion" }
rune-staging = { path = "../rune-staging" }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
bytemuck = { version = "1.25", features = ["derive"] }

[target.'cfg(all(not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "dx12"] }

[dev-dependencies]
rune = { path = "../rune" }
rune-ref = { path = "../rune-ref" }
ab_glyph = "0.2.32"
png = "0.18"

[lints]
workspace = true
