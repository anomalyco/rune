[package]
name = "rune-core"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Zero-GPU, zero-windowing foundation primitives for Rune: colour, design tokens, themes, vector shapes, state machines, clocks, off-UI tasks, tracked reads, growth curves, live values, latest-wins requests, launch marks, app directories, and preferences."

[dependencies]
portable-atomic = "1"
rune-motion = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Window"] }
web-time = "1"

[lints]
workspace = true
