[package]
name = "rune"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[features]
native-file-dialog = ["dep:rfd"]

[dependencies]
rune-motion = { path = "../rune-motion" }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
# Keep Wayland client-side frames/buttons without the title font's ab_glyph/ttf-parser.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
parley = { version = "0.12", default-features = false, features = ["std"] }
swash = "0.2.10"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1"
png = "0.18"
serde_json = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
portable-atomic = "1"
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
blake3 = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
block2 = "0.5"
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSGeometry", "NSString", "NSThread", "NSUserDefaults"] }
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSButton", "NSControl", "NSEvent", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "NSColor", "NSGraphics", "NSPanel", "NSScreen"] }
objc2-video = { package = "objc2", version = "0.6" }
objc2-core-foundation = "0.3"
objc2-core-video = { version = "0.3", features = ["CVPixelBufferIOSurface", "objc2-io-surface"] }
objc2-io-surface = "0.3"
objc2-metal = "0.3"

[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "ios"), not(target_os = "android")))'.dependencies]
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.13", features = ["shape"] }
xkbcommon = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "dx12"] }
