[package]
name = "rune"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "GPU-rendered Rust UI framework (wgpu, winit) with keyed element trees, Taffy layout, analytic springs, and headless tooling."
autotests = false

[features]
default = ["accessibility", "dbus", "embedded-fonts", "hunspell", "metal-backend", "ogg-audio", "svg", "rune-gpu/default", "rune-image/default", "rune-media/default", "rune-text/default"]
# Bundle Inter (Regular, Medium, SemiBold; on web also IBM Plex Mono) as the fonts text falls back
# to when the app registers none. Disable when AppSpec::fonts supplies the app's own fonts to omit
# the bytes (about 1.25 MB native).
embedded-fonts = ["rune-text/embedded-fonts"]
# Fall back to WebGL2 on wasm32 when WebGPU is unavailable.
webgl = ["wgpu/webgl"]
# Agent tooling in release builds: `--snap`, `--tree`, `--script`, `--trace`, `--strip`, `--video`,
# `--html`, `--desktop`, `--native --trace` and the other dev flags `run` takes from the command line
# (README, "Agent tooling"), plus auto-enabling interaction timing from a loopback
# `OTEL_EXPORTER_OTLP_ENDPOINT`. Debug builds always have it. Off, a release app links only its
# window (examples/hello: 3,480,576 B less), parses no Rune flags from the process command line
# (every argument goes to `extra_args`), and ignores `OTEL_EXPORTER_OTLP_ENDPOINT` unless
# `RUNE_PERF=1` is set; an explicit `App::args` headless run still fails saying so, and
# `rune::tooling::headless_run` and the test helpers work either way.
tooling = []
# `--keys` and `--pointer` (keycaps and click ripples over headless frames and videos) in release builds.
# They draw with a second `Runtime`, about 1.46 MB of an app's exe, so `tooling` leaves them out;
# debug builds always have them.
keys-overlay = ["tooling"]
# Windows: link ICU4X's word dictionaries (Chinese and Japanese words above all: 1,939,456 B of a
# minimal release exe) instead of asking Windows' own ICU (`icu.dll`, Windows 10 1903 and later) for
# the words a double-click and word movement take. For an app that runs where `icu.dll` isn't
# (Server Core). Line breaks never need it: Thai, Lao, Khmer and Burmese keep their baked line
# dictionaries either way. Other native platforms always link the word dictionaries.
segmenter-dictionaries = ["rune-text/segmenter-dictionaries"]
# Headless benchmark instrumentation; ordinary builds contain no phase clocks.
frame-profile = ["tooling", "dep:procwatch"]
# A measuring build's heap dumps (procwatch's `alloc-sites`) also list the GPU device's allocations.
alloc-sites = ["dep:procwatch", "procwatch/alloc-sites", "wgpu/counters"]
# Native Open, Save and folder dialogs: rfd on macOS and Windows, the XDG desktop portal over zbus on Linux.
native-file-dialog = ["dep:rfd", "dbus"]
hot = ["dep:subsecond", "dep:dioxus-devtools"]
# macOS: let an overlay set its element's cursor while its app isn't frontmost. macOS ignores
# `[NSCursor set]` from a background app; this sets WindowServer's private per-connection
# `SetsCursorInBackground` property, looked up at run time. Private API: App Store review may
# reject an app built with it. Off, the lookup isn't compiled in, and a non-key overlay's
# cursor shows only while its app is frontmost.
macos-background-cursor = []
# Windows 11 Build 22000+: opt-in per-element behind-window blur for `El::system_material` on
# transparent DirectComposition windows and overlays using documented `DWMWA_USE_HOSTBACKDROPBRUSH`
# and `Windows.UI.Composition` (`Compositor::CreateHostBackdropBrush`). Off by default while live
# Windows 11 hardware checks confirm unfocused overlay blur and spring tracking; off, no
# `Windows.UI.Composition` types or WinRT composition features are compiled in.
windows-system-material = [
    "windows/Foundation",
    "windows/Foundation_Numerics",
    "windows/Graphics_Effects",
    "windows/System",
    "windows/UI_Composition",
    "windows/UI_Composition_Desktop",
    "windows/UI_ViewManagement",
    "windows/Win32_Graphics_Direct2D",
    "windows/Win32_Graphics_Direct2D_Common",
    "windows/Win32_System_WinRT_Composition",
    "windows/Win32_System_WinRT_Graphics_Direct2D",
]
# macOS: play Ogg (Vorbis, Opus) and WebM/Matroska audio, which AVFoundation can't read, by
# decoding it in Rust (symphonia, opuscule) and handing AVPlayer the PCM. Off, those clips
# fail at once with a clear message.
ogg-audio = ["rune-media/ogg-audio"]
# SVG and SVGZ images (`ImageCache::svg`, `file`, `load_mime`, and `load` on sniffed SVG bytes), and
# scalable Linux app icons, rasterized by resvg. Off, those images resolve to `Image::error`.
svg = ["rune-image/svg", "rune-text/svg"]
# AVIF images (`ImageCache::load` on AVIF bytes), decoded natively by rav1d, a Rust port of
# dav1d; an animated AVIF shows its first frame. Building it for x86 needs NASM on the PATH for
# rav1d's assembly. Off, AVIF bytes resolve to `Image::error`. No effect on web, where the
# browser decodes AVIF.
avif = ["rune-image/avif"]
# Linux: spell check text fields (`El::spellcheck`) against installed system Hunspell
# dictionaries via `spellbook` (MPL-2.0) and `unicode-segmentation`. Off (for example with
# `default-features = false` or a permissive-only licence policy), `spellbook` is not compiled on
# Linux and `El::spellcheck` falls back to a no-op there. No effect on Windows (`ISpellChecker`),
# macOS (`NSSpellChecker`), or web (which always enables `rune-spell/hunspell`).
hunspell = ["rune-spell/hunspell"]
# Linux desktop services over D-Bus (zbus over async-io): the desktop's light or dark preference
# (the Settings portal), the system tray (`Tray`), global shortcuts on Wayland (the
# GlobalShortcuts portal), the Secret Service (`rune::credentials`) and, with `native-file-dialog`,
# the FileChooser portal. Off, those D-Bus crates are not compiled for Rune's own services: a
# window winit gives no theme draws dark, `Tray::new` returns `TrayError::Unsupported` on Linux, a
# Wayland session's global shortcuts return `ShortcutError::Unsupported` (X11 shortcuts keep
# working) and `Credentials::system` returns `CredentialError::Unsupported`. No effect on other
# platforms.
dbus = ["dep:async-channel", "dep:async-executor", "dep:async-io", "dep:futures-lite", "dep:serde", "dep:zbus"]
# macOS and iOS: Rune's native Metal backend (research/34). Mac apps draw with it by default; an
# app opts out with `App::gpu_backend(GpuBackend::Wgpu)`, or a launch with `RUNE_GPU_BACKEND=wgpu`,
# and an app built with `default-features = false` draws with wgpu unless it adds this feature.
# iOS apps keep wgpu unless they choose `GpuBackend::Metal`. It plugs in through wgpu's `custom`
# backend, which Rune turns on for Apple targets alone. No effect on other platforms: its crates
# are Apple-only dependencies.
metal-backend = ["rune-gpu/metal-backend", "rune-media/metal-backend"]
# Every window and overlay exposes its elements to the OS accessibility API through AccessKit:
# UI Automation on Windows, NSAccessibility on macOS, AT-SPI on Linux (README, "Accessibility").
# Nothing is built until an assistive client asks. Off, the platform adapters aren't compiled;
# `Runtime::accessibility_tree` and `--tree` still report the tree.
accessibility = ["dep:accesskit_windows", "dep:accesskit_macos", "dep:accesskit_unix"]
# Use upstream `taffy::TaffyTree` instead of `rune_taffy::LayoutStore` for A/B benchmarks and parity checks.
baseline-taffy = ["rune-taffy/baseline-taffy"]
# Live GPU resource counters (`Device::get_internal_counters`) for upload tests and `upload_bench`.
test-gpu-counters = ["wgpu/counters"]
# GPU-free wgpu noop backend for Linux surface-failure and device-loss tests.
test-gpu-noop = ["wgpu/noop"]

[dependencies]
# The accessibility tree's types; the platform adapters below come with `accessibility`.
accesskit = "0.25.2"
procwatch = { workspace = true, optional = true }
subsecond = { version = "=0.7.10", optional = true }
dioxus-devtools = { version = "=0.7.10", optional = true }
rune-core = { workspace = true }
rune-edit = { workspace = true }
rune-gpu = { workspace = true }
rune-image = { workspace = true }
rune-media = { workspace = true }
rune-motion = { workspace = true }
rune-spell = { workspace = true, default-features = false }
rune-staging = { workspace = true }
rune-taffy = { workspace = true }
rune-text = { workspace = true }
# Allow backend patch fixes; headless pixel equivalence guards the precompiled Metal path.
wgpu = { workspace = true, features = ["std", "parking_lot", "wgsl"] }
# Keep Wayland client-side frames/buttons without the title font's ab_glyph/ttf-parser.
winit = { workspace = true, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
taffy = { workspace = true, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
parley = { workspace = true, features = ["std"] }
bytemuck = { workspace = true }
png = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true, features = ["png"] }
blake3 = { workspace = true }
rustc-hash = { workspace = true }
zeroize = { workspace = true }
half = { workspace = true }
unicode-segmentation = { workspace = true }

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
# The thread CPU clock for frame profiles and debug builds' stall warnings.
libc = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "ios"), not(target_os = "android")))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

# Pasted images on Windows and Linux; macOS reads the pasteboard's PNG or TIFF itself.
[target.'cfg(any(target_os = "windows", all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android")))))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control", "image-data"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rune-spell = { workspace = true, features = ["hunspell"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = "0.1"
wgpu = { workspace = true, features = ["webgpu"] }
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "CssStyleDeclaration", "MediaQueryList", "Node", "console"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rfd = { version = "0.17", optional = true, default-features = false }

# Metal on macOS and iOS: present timing and system materials on macOS.
[target.'cfg(target_vendor = "apple")'.dependencies]
block2 = { workspace = true }
objc2 = { workspace = true }
objc2-core-foundation = { workspace = true, features = ["std", "CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFPreferences", "CFString", "objc2"] }
objc2-foundation = { workspace = true, features = ["std", "NSString"] }
objc2-metal = { workspace = true, features = ["std", "MTLDrawable", "block2", "objc2-core-foundation"] }
# wgpu's Metal backend on Apple targets alone: off Apple, wgpu compiles neither `wgpu-hal/metal`
# nor `naga/msl-out`.
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "0.27.2", optional = true }
# Names for the interaction watchdog's stack samples (`tooling::interaction::stack`).
rustc-demangle = "0.1"
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSAttributedString", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSObject", "NSRange", "NSValue", "NSProcessInfo", "NSString", "NSThread", "NSURL", "NSUserDefaults", "objc2-core-foundation"] }
objc2-app-kit = { workspace = true, features = ["std", "bitflags", "objc2-core-foundation", "NSApplication", "NSButton", "NSCell", "NSColorSpace", "NSControl", "NSEvent", "NSFont", "NSFontDescriptor", "NSHapticFeedback", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "NSColor", "NSGraphics", "NSPanel", "NSScreen", "NSPasteboard", "NSPasteboardItem", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSGraphicsContext", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSAttributedString"] }
objc2-core-video = { workspace = true, features = ["std", "CVBase", "CVDisplayLink", "CVHostTime", "CVReturn", "objc2-core-graphics"] }
objc2-core-graphics = { workspace = true, features = ["std", "CGColorSpace"] }

[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "ios"), not(target_os = "android")))'.dependencies]
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.13", features = ["shape", "xinput", "randr", "allow-unsafe-code", "dl-libxcb"] }
xkbcommon = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
# DirectComposition handover (`platform::win32::dcomp_handover`), OLE drag and drop
# (`drag_out::windows`, `platform::win32::drop_target`), jump lists and the taskbar button's
# progress and badge (`platform::win32::{jump_list,taskbar}`).
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
# `#[windows::core::implement]` (the OLE drop target, `platform::win32::drop_target`) names this crate.
windows-core = { workspace = true }
# D3D12 alone: a machine without a hardware D3D12 adapter draws on WARP, D3D12's own software
# adapter. Vulkan was only that fallback here, and it compiled in `ash`, `libloading` and the
# Vulkan backend.
wgpu = { workspace = true, features = ["dx12"] }
accesskit_windows = { version = "0.35.2", optional = true }
# `AppHandle::register_url_scheme` writes the per-user `Software\Classes\<scheme>` entry.
windows-registry = "0.6"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_System_DataExchange", "Win32_System_Memory"] }

[target.'cfg(target_os = "linux")'.dependencies]
# AT-SPI over D-Bus on its own async-io thread, started only when the desktop's accessibility bus is on.
accesskit_unix = { version = "0.24.1", optional = true }
async-channel = { version = "2", optional = true }
async-executor = { version = "1", optional = true }
async-io = { version = "2", optional = true }
futures-lite = { version = "2", default-features = false, features = ["std"], optional = true }
libc = { workspace = true }
libloading = "0.8"
serde = { workspace = true, optional = true }
zbus = { version = "5.19", default-features = false, features = ["async-io"], optional = true }

# wgpu's Vulkan backend everywhere but Windows (D3D12 above) and Apple (Metal above).
[target.'cfg(all(not(target_vendor = "apple"), not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

# build.rs hashes the uber shader's WGSL; share the same feature set as the normal dependency.
[build-dependencies]
blake3 = { workspace = true }

[dev-dependencies]
# The HLSL wgpu generates, for the precompiled uber shader (`render/dxbc_tests.rs`).
log = "0.4"
# WebGL2 GLSL ES 3.00 shader translation check (`render/webgl_shader_tests.rs`).
naga = { version = "~30.0.1", default-features = false, features = ["wgsl-in", "glsl-out"] }
# Experimental swash oracle in `examples/text_quality.rs`.
swash = { workspace = true }

# A UI Automation client for `tests/accessibility_windows.rs`.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility"] }

