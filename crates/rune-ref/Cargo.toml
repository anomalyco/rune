[package]
name = "rune-ref"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Scalar CPU reference renderer for Rune's device-pixel instance stream."
autotests = false

[features]
gpu = ["dep:rune", "dep:rune-fx", "dep:wgpu"]

[dependencies]
libm = { version = "=0.2.16", default-features = false, features = ["force-soft-floats"] }
blake3 = { workspace = true }
half = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rune = { workspace = true, default-features = true, optional = true }
rune-fx = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = "=0.20.0"

[[bench]]
name = "instructions"
harness = false

[[test]]
name = "alloc"

[[test]]
name = "differential"

[[test]]
name = "fx_blend"

[[test]]
name = "parity"

[[test]]
name = "reference"

[lints]
workspace = true
