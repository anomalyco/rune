[package]
name = "rune-taffy"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[features]
default = []
# Use upstream `taffy::TaffyTree` instead of `LayoutStore` for A/B benchmarks and parity checks.
# Upstream `taffy::Style` has no `whole_rows` bit, so `whole_rows` trees lay out unrounded here.
baseline-taffy = []

[dependencies]
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
stacker = "0.1"

[lints]
workspace = true
