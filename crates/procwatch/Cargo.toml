[package]
name = "procwatch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "A native app's own memory and CPU, watched from inside: footprint, per-thread CPU (exited threads too), open files, a counting allocator, byte gauges for native buffers, warnings in the log, and a loopback JSON endpoint."

[features]
# Count `Gauge` bytes in builds without debug assertions too. Off by default, so a release
# build's gauges compile to nothing.
release-gauges = []

[dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
