[package]
name = "rune-image"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Content-addressed image decoding, linear-light mip generation, shelf pixel atlas, SVG/AVIF codecs, and OS app icon rasterization for Rune."

[features]
default = ["png", "svg"]
# Web (`wasm32`): decode PNG, APNG and ICNS bytes and convert embedded ICC profiles in Rust
# (`image/png`, `moxcms`). Off (for example with `default-features = false`), `wasm32` hands
# PNG and ICNS bytes to the browser's `createImageBitmap` decoder (which applies ICC colour
# conversion natively) and omits `image`, `png`, `fdeflate`/`flate2`/`miniz_oxide` and `moxcms`.
# No effect on native targets, which always link the Rust raster decoders and ICC conversion.
png = ["dep:image", "dep:moxcms"]
# SVG and SVGZ images (`ImageCache::svg`, `file`, `load_mime`, and `load` on sniffed SVG bytes),
# and scalable Linux app icons, rasterized by resvg. Off, those images resolve to `Image::error`.
svg = ["dep:resvg"]
# AVIF stills (`ImageCache::load` on AVIF bytes), decoded natively by rav1d (a pure-Rust port of
# dav1d) with per-load pixel budgets enforced in rav1d (`frame_size_limit`), in preflight, and
# before RGBA conversion; animated AVIF (`avis`) is rejected natively. Off, AVIF bytes resolve to
# `Image::error`. No effect on web, where the browser decodes AVIF stills and the first frame of
# AVIF sequences.
avif = ["dep:avif-parse", "dep:libc", "dep:rav1d", "dep:yuv"]

[dependencies]
blake3 = { workspace = true }
resvg = { workspace = true, optional = true }
rune-core = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
avif-parse = { version = "2.1", optional = true }
libc = { workspace = true, optional = true }
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"], optional = true }
yuv = { version = "0.8", optional = true }
# Native raster decoders and embedded ICC conversion; always linked on native targets.
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
moxcms = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["std", "NSGeometry", "NSObject", "NSString", "objc2-core-foundation"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
png = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
# Optional on wasm32 (enabled by the default-on `png` feature); off, PNG and ICNS bytes decode
# through the browser's `createImageBitmap` instead.
image = { workspace = true, features = ["png"], optional = true }
moxcms = { workspace = true, optional = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[lints]
workspace = true
