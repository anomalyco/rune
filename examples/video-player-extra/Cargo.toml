[package]
name = "video-player-extra"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish = false

[features]
# Pick exactly one Linux live Player backend (mutually exclusive in rune). macOS ignores these.
gstreamer = ["rune/linux-gstreamer"]
libmpv = ["rune/linux-libmpv"]
libvlc = ["rune/linux-libvlc"]

[dependencies]
async-std = "1"
rune = { path = "../../crates/rune", features = ["native-file-dialog"] }
rune-kit = { path = "../../crates/rune-kit" }
rune-theme-opencode = { path = "../../themes/opencode" }
