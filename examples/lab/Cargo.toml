[package]
name = "lab"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[dependencies]
rune = { workspace = true, default-features = true, features = ["keys-overlay"] }
rune-motion = { workspace = true }
rune-fx = { workspace = true }
rune-light = { workspace = true }
wgpu = { workspace = true, features = ["std", "parking_lot", "wgsl"] }
bytemuck = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
pollster = { workspace = true }
rune-gpu = { workspace = true }
windows = { workspace = true, features = ["Win32_Graphics_Direct3D12"] }

[target.'cfg(all(not(target_vendor = "apple"), not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu"] }

[lints]
workspace = true
