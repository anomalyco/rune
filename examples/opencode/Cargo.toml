[package]
name = "opencode"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[features]
hot = ["rune/hot"]

[dependencies]
rune = { path = "../../crates/rune" }
serde_json = "1"
ureq = { version = "3.4", default-features = false }
rune-kit = { path = "../../crates/rune-kit", features = ["markdown"] }
rune-theme-opencode = { path = "../../themes/opencode" }
