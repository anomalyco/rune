[package]
name = "motion-bento-chaos"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish = false
description = "The motion bento's shared parts: the seeded chaos schedule, the tiles' logical state, the springs and colours, and the frame meter. No UI framework."

[dependencies]
procwatch = { workspace = true }

[target.'cfg(not(windows))'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[lints]
workspace = true
