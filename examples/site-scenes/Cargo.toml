[package]
name = "site-scenes"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish = false
description = "Renders the material stills on Rune's home page headless: liquid metal, glass and light."

[dependencies]
rune = { path = "../../crates/rune", features = ["keys-overlay"] }
rune-fx = { path = "../../crates/rune-fx" }
rune-light = { path = "../../crates/rune-light" }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "dx12"] }

[lints]
workspace = true
