[package]
name = "knobs"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[dependencies]
rune = { workspace = true, default-features = true, features = ["keys-overlay"] }
rune-knobs = { workspace = true }

[features]
default = ["panel"]
# A real app turns this on only in its dev builds; shipped builds read each knob's default.
panel = ["rune-knobs/panel"]

[lints]
workspace = true
