[package]
name = "luau-panel"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "luau-panel"
path = "src/main.rs"

[[bin]]
name = "luau-bench"
path = "src/bin/bench.rs"

[dependencies]
rune = { path = "../../crates/rune" }
serde = { version = "1", features = ["derive"] }
rune-luau = { path = "../../crates/rune-luau", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rune-luau = { path = "../../crates/rune-luau", features = ["serde", "watch"] }

# The bench compares Luau's interpreter with its native code, which this example turns on where
# Luau has it.
[target.'cfg(all(any(target_os = "windows", target_os = "linux"), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
rune-luau = { path = "../../crates/rune-luau", features = ["serde", "watch", "native-code"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[lints]
workspace = true
