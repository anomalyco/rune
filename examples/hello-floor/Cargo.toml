[package]
name = "hello-floor"
version = "0.0.1"
edition.workspace = true
license.workspace = true

# `hello-floor`: one Rune window, one line of text, and switches for what a window can do without.
# `hello-floor-bare`: the same window with no framework, stopped at each step of a Direct3D
# start, to read what the API and the driver cost on their own (Windows).
[[bin]]
name = "hello-floor"
path = "src/main.rs"

[[bin]]
name = "hello-floor-bare"
path = "src/bare.rs"

[dependencies]
rune = { workspace = true, default-features = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
    "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true