[package]
name = "settings"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[features]
frame-profile = ["rune/frame-profile", "dep:procwatch"]
hot = ["rune/hot"]

[dependencies]
procwatch = { workspace = true, optional = true }
rune = { workspace = true, default-features = true, features = ["keys-overlay"] }
rune-kit = { workspace = true, default-features = false }

[lints]
workspace = true
