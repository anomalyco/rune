name: macOS tests

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

# A push or PR update makes its older runs moot; an hour-long Mac job per push queued six deep.
concurrency:
  group: macos-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/file-size.sh

  test:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # One job per core: serial builds ran past the timeout with no cache, so no cache was ever saved.
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_TEST_STRIP: debuginfo
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The virtual Metal adapter does not expose TIMESTAMP_QUERY. Keep the
      # shader freshness, pipeline, rendering, font and menu tests enabled.
      - run: >-
          cargo test -p rune -p rune-kit --features rune-kit/markdown --no-fail-fast --
          --skip gpu::metal::compute_tests::passes_sample_timestamps_at_their_boundaries
