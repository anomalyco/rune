name: site

# Deploys the docs site in site/. dev deploys https://dev.anoma.ly/team/rune, production deploys https://anoma.ly/team/rune.
on:
  push:
    branches: [dev, production]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

concurrency:
  group: site-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'release' }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/rune-${{ github.ref_name == 'dev' && 'dev' || 'release' }}
          role-session-name: site-${{ github.run_id }}
          aws-region: us-east-1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Cloudflare token
        id: cloudflare-token
        run: bash "$GITHUB_WORKSPACE/.github/release/cloudflare-token.sh"
        env:
          CLOUDFLARE_TOKEN_URL: ${{ vars.CLOUDFLARE_TOKEN_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - run: bun run deploy:${{ github.ref_name == 'production' && 'production' || 'dev' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare-token.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
