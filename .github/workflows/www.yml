name: www

# The public page in www/ is the Rune app in www/app. CI builds it to wasm, has the native build write its static
# HTML (`--html`), and deploys: dev to https://dev.anoma.ly/rune, production to https://anoma.ly/rune. Pull requests
# build the dev page and deploy nothing. Rune itself is the page, so a change under crates/ triggers it too.
on:
  push:
    branches: [dev, production]
    paths:
      - "www/**"
      - "crates/**"
      - "scripts/web-build.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/www.yml"
  pull_request:
    paths:
      - "www/**"
      - "crates/**"
      - "scripts/web-build.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/www.yml"

concurrency:
  group: www-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BINARYEN_VERSION: "133"
  MODE: ${{ github.ref_name == 'production' && 'production' || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v5
      # Pull requests build and deploy nothing, so they never assume the role.
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/rune-release
          role-session-name: www-${{ github.run_id }}
          aws-region: us-east-1
      - name: Fetch the release secrets
        if: github.event_name == 'push'
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            CLOUDFLARE_API_TOKEN,rune/release/CLOUDFLARE_API_TOKEN
          parse-json-secrets: false
      # rust-toolchain.toml picks the toolchain. rust-src is installed up front: otherwise rustup fetches it mid-build
      # from parallel rustc calls, which race and fail.
      - name: Rust toolchain
        working-directory: .
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: www
          save-if: ${{ github.event_name == 'push' }}
      - name: wasm-bindgen version from Cargo.lock
        id: bindgen
        working-directory: .
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - uses: actions/cache@v4
        id: binaryen
        with:
          path: ~/.binaryen
          key: binaryen-${{ env.BINARYEN_VERSION }}
      - name: Install binaryen
        if: steps.binaryen.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.binaryen
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/binaryen-version_$BINARYEN_VERSION-x86_64-linux.tar.gz" \
            | tar -xz -C ~/.binaryen --strip-components=1
      - run: echo "$HOME/.binaryen/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The native app (tests and the `--html` export) links winit's keyboard library.
      - name: Native libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - name: Test the page
        working-directory: .
        run: cargo test -p rune-www
      - name: Build
        run: bun run build --mode "$MODE"
      - name: Deploy
        if: github.event_name == 'push'
        run: bunx cf deploy --prebuilt --mode "$MODE"
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
