name: migrate-secrets

# Temporary: copies the repo's GitHub secrets into AWS Secrets Manager. Removed once the
# workflows read them from AWS.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/rune-release
          role-session-name: rune-migrate-${{ github.run_id }}
          aws-region: us-east-1
      - name: Copy CLOUDFLARE_API_TOKEN
        env:
          V: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: aws secretsmanager put-secret-value --secret-id rune/release/CLOUDFLARE_API_TOKEN --secret-string "$V" > /dev/null
