[workspace]
resolver = "3"
members = [
    "crates/rune",
    "crates/rune-ref",
    "crates/rune-motion",
    "crates/rune-i18n",
    "crates/rune-staging",
    "crates/rune-kit",
    "crates/rune-highlights",
    "crates/rune-fx",
    "crates/rune-light",
    "crates/procwatch",
    "crates/rune-register",
    "crates/rune-knobs",
    "crates/rune-mac",
    "crates/rune-notify",
    "crates/rune-mermaid",
    "crates/rune-perf",
    "crates/rune-luau",
    "crates/rune-taffy",
    "themes/opencode",
    "examples/hello",
    "examples/web-hello",
    "examples/web-showcase",
    "www/app",
    "examples/todo",
    "examples/settings",
    "examples/playground",
    "examples/knobs",
    "examples/kit-gallery",
    "examples/background",
    "examples/live-values",
    "examples/shapes",
    "examples/overlay",
    "examples/overlay-lab",
    "examples/lab",
    "examples/showreel",
    "examples/video-player",
    "examples/video-tiles",
    "examples/cursed-settings",
    "examples/drag-out",
    "examples/sketch",
    "examples/drop-files",
    "examples/rich-clipboard",
    "examples/matched",
    "examples/launcher",
    "examples/glass-card",
    "examples/glass-panel",
    "examples/frosted-bar",
    "examples/odometer",
    "examples/motion-bento",
    "examples/motion-bento/chaos",
    "examples/site-scenes",
    "examples/luau-panel",
]
exclude = ["tools/rune-dev-guard", "vendor/accesskit_windows", "vendor/parley_engine", "vendor/wgpu-hal", "vendor/winit"]

# wgpu-hal as published plus `vendor/wgpu-hal.patch`: `dx12::Instance::expose_adapter` (a `wgpu::Adapter` for the
# one adapter Rune picks through DXGI, with no device made on the others, `gpu/pick.rs`) and FXC loaded on
# the first compile rather than with the instance (Rune's uber shader is precompiled), and partial presents
# (`Surface::set_present_rects`: `Present1` dirty rectangles on a sequential flip-model swap chain, for
# `render::damaged`). Re-made by
# `scripts/vendor-wgpu-hal.sh <version>` when wgpu is bumped. An app that builds Rune patches it too:
# a dependency's `[patch]` doesn't apply to the workspace that depends on it.
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
# winit as published plus `vendor/winit.patch`: on Windows a new window isn't added again to the
# taskbar it's already on (that took CoInitializeEx and a TaskbarList COM object, about 7,800 µs
# and nine shell DLLs, before every window's first frame), and a window given a position is made there, so it is
# born at that display's scale instead of crossing to it and being resized. Re-made by
# `scripts/vendor-winit.sh <version>` when winit is bumped; apps that build Rune patch it too.
winit = { path = "vendor/winit" }
# parley_engine as published plus `vendor/parley_engine.patch`: UAX #9 rule L1 for a paragraph's
# trailing whitespace and isolates (BidiTest.txt 770,241 of 770,241; 644,283 without it), and
# shaping that stops redoing work from the same inputs: an analyzer keeps the ICU segmenters it
# made, and a run's or a style's font metrics are made once per font instance and size (14% off
# a text's shaping, layouts identical). Re-made by `scripts/vendor-parley-engine.sh <version>` when parley is bumped; apps that build
# Rune patch it too.
parley_engine = { path = "vendor/parley_engine" }
# accesskit_windows as published plus `vendor/accesskit_windows.patch`: headings and landmarks reach
# UI Automation (HeadingLevel, LandmarkType, LocalizedLandmarkType), which Narrator's and NVDA's
# heading and landmark navigation read. Re-made by `scripts/vendor-accesskit-windows.sh <version>`
# when AccessKit is bumped; apps that build Rune patch it too.
accesskit_windows = { path = "vendor/accesskit_windows" }

[workspace.package]
edition = "2024"
license = "MIT"

# Full debug info for the workspace crates made a single `rune` test build use 18-23 GB of RAM;
# line tables keep backtraces and file:line in panics at a fraction of that.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16
incremental = true

# Benchmarks and perf numbers. Same codegen as release, without incremental, which can move
# frame timings. The runtime bench scripts refuse binaries built with any other profile.
[profile.perf]
inherits = "release"
opt-level = 3
codegen-units = 16
lto = false
debug = false
incremental = false

# `cargo bench` inherits release; scripts/check-reference-instructions.sh compares its instruction
# counts across revisions.
[profile.bench]
incremental = false

[profile.rune-hot]
inherits = "dev"
debug = 0
incremental = true

[profile.rune-hot.package.png]
opt-level = 3

[profile.rune-hot.package.fdeflate]
opt-level = 3

[workspace.lints.rust]
# shared-lints begin
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
# shared-lints end
unsafe_code = "allow" # shared: forbid; GPU and FFI code needs unsafe

[workspace.lints.clippy]
# shared-lints begin
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
disallowed_types = "deny"
expect_used = "warn"
todo = "warn"
unwrap_used = "warn"
# shared-lints end
undocumented_unsafe_blocks = "warn" # shared: deny; errors left
let_underscore_must_use = "warn" # shared: deny; errors left
disallowed_methods = "warn" # shared: deny; errors left
